<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Timer Builder — Cronômetro Simples</title>
<style>
  :root{--bg:#000;--fg:#eee;--accent:#8a2be2;--muted:#9b9b9b}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,Segoe UI,Roboto,Arial}
  .wrap{max-width:980px;margin:20px auto;padding:18px;display:grid;grid-template-columns:320px 1fr;gap:18px}
  .panel{background:#070707;border:1px solid rgba(138,43,226,0.12);padding:14px;border-radius:10px}
  h1{font-size:20px;margin:0 0 10px 0;color:var(--accent)}
  label{font-size:12px;color:var(--muted)}
  input[type=number],input[type=text],select{width:100%;padding:8px;border-radius:8px;border:1px solid #111;background:#050505;color:var(--fg);margin-top:6px}
  .list{margin-top:10px;max-height:420px;overflow:auto}
  .round{display:flex;gap:8px;align-items:center;padding:8px;border-radius:8px;background:linear-gradient(90deg,rgba(138,43,226,0.03),transparent);margin-bottom:8px}
  .round input{width:76px}
  .round .name{flex:1}
  .btn{background:transparent;border:1px solid rgba(255,255,255,0.05);color:var(--fg);padding:8px 10px;border-radius:8px;cursor:pointer}
  .btn.primary{background:linear-gradient(90deg,var(--accent),#6f50d8);color:#fff;border:0}

  /* timer */
  .timer{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px}
  .time{font-size:56px;font-weight:700;color:var(--fg)}
  .phase{font-size:14px;color:var(--muted);margin-bottom:6px}
  .controls{display:flex;gap:8px;margin-top:18px}
  .small{font-size:13px;padding:6px 8px}
  .meta{margin-top:12px;color:var(--muted);font-size:13px}

  /* progress ring */
  .ring{width:220px;height:220px;display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:12px}
  .ring svg{transform:rotate(-90deg)}
  .ring .center{position:absolute;display:flex;flex-direction:column;align-items:center}

  @media(max-width:880px){.wrap{grid-template-columns:1fr;padding:12px}.timer{padding:18px}.time{font-size:44px}}
  .round.dragging{opacity:0.6;transform:scale(0.995)}
  .round.drag-over-top{outline:2px dashed var(--accent);outline-offset:-6px}
  .round.drag-over-bottom{outline:2px dashed var(--accent);outline-offset:-6px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <h1>Timer Builder</h1>
      <!-- Removed warmup/rest/end: user will configure all blocks manually -->
      <div style="margin-top:6px;color:var(--muted);font-size:13px">Configure todos os blocos manualmente abaixo.</div>

      <hr style="opacity:0.06;margin:12px 0">
      <div style="display:flex;gap:8px;align-items:center">
        <input id="newName" type="text" placeholder="Nome do round (ex: Circuito)" style="flex:1;padding:8px;border-radius:8px;border:1px solid #111;background:#050505;color:var(--fg)">
        <input id="newDur" type="number" value="60" min="1" style="width:70px">
        <select id="newUnit" style="width:70px;padding:8px;border-radius:8px;background:#050505;border:1px solid #111;color:var(--fg)">
          <option value="s">seg</option>
          <option value="m">min</option>
        </select>
        <button id="addRound" type="button" class="btn primary">Adicionar</button>
      </div>

      <div><label style="font-weight:600;margin-bottom:6px;display:block;color:var(--muted)">Blocos adicionados</label><div class="list" id="rounds"></div></div>

      <div style="display:flex;gap:8px;margin-top:8px">
        <button id="clearAll" type="button" class="btn small">Limpar</button>
      </div>

      <div class="meta">Dica: edite nome e duração de cada round. As alterações são salvas automaticamente.</div>
    </div>

    <div class="panel timer">
      <div class="ring">
        <svg width="220" height="220" viewBox="0 0 100 100">
          <defs>
            <linearGradient id="grad" x1="0" x2="1">
              <stop offset="0" stop-color="#9b59ff" />
              <stop offset="1" stop-color="#8a2be2" />
            </linearGradient>
          </defs>
          <circle cx="50" cy="50" r="40" stroke="rgba(255,255,255,0.06)" stroke-width="6" fill="none" />
          <circle id="prog" cx="50" cy="50" r="40" stroke="url(#grad)" stroke-width="6" stroke-linecap="round" stroke-dasharray="0 251.2" fill="none"></circle>
        </svg>
        <div class="center">
          <div class="phase" id="phaseName">Pronto</div>
          <div class="time" id="timeLeft">00:00</div>
        </div>
      </div>

      <div class="controls">
        <button id="prev" type="button" class="btn">◀</button>
        <button id="start" type="button" class="btn primary">Iniciar</button>
        <button id="pause" type="button" class="btn">Pausar</button>
        <button id="next" type="button" class="btn">▶</button>
        <button id="reset" type="button" class="btn">Reiniciar</button>
      </div>

      <div class="meta" id="info">Round 0 / 0 • Total: 00:00</div>
    </div>
  </div>

<script>
const LS='mma.simple.timer.v1';
let store = {warmup:30,rest:60,end:60,rounds:[{name:'Round 1',dur:60},{name:'Round 2',dur:60}]};
// runtime flag — declared early to avoid TDZ when updateUI/renderRounds runs before timer initialization
var running = false;
function load(){try{const s=localStorage.getItem(LS); if(s) store=JSON.parse(s);}catch(e){} updateUI();}
function save(){localStorage.setItem(LS,JSON.stringify(store)); updateUI();}

const els={warmup:1,rest:1,end:1,rounds:1,newName:1,newDur:1};
els.warmup = document.getElementById('warmup'); els.rest = document.getElementById('rest'); els.end = document.getElementById('end'); els.rounds = document.getElementById('rounds'); els.newName = document.getElementById('newName'); els.newDur = document.getElementById('newDur');
const startBtn=document.getElementById('start'); const pauseBtn=document.getElementById('pause'); const resetBtn=document.getElementById('reset'); const prevBtn=document.getElementById('prev'); const nextBtn=document.getElementById('next'); const timeLeftEl=document.getElementById('timeLeft'); const phaseNameEl=document.getElementById('phaseName'); const infoEl=document.getElementById('info'); const progEl = document.getElementById('prog');

function renderRounds(){els.rounds.innerHTML=''; store.rounds.forEach((r,i)=>{
  const div=document.createElement('div'); div.className='round'; div.setAttribute('draggable','true'); div.dataset.index = i;
  const disabledAttr = (typeof running !== 'undefined' && running) ? 'disabled' : '';
  // determine unit and display value
  const currentSeconds = r.dur || 0; const useMin = currentSeconds % 60 === 0 && currentSeconds !== 0; const displayVal = useMin ? (currentSeconds/60) : currentSeconds; const unitSel = useMin ? 'm' : 's';
  div.innerHTML = `<div class="name"><input data-i="${i}" class="rname" value="${escapeHtml(r.name)}" style="background:transparent;border:0;color:var(--fg)"></div><input data-i="${i}" class="rdur" type="number" value="${displayVal}" min="1" step="1"><select data-i="${i}" class="runit" style="width:70px;padding:6px;border-radius:6px;background:#050505;border:1px solid #111;color:var(--fg)"><option value="s" ${unitSel==='s'?'selected':''}>seg</option><option value="m" ${unitSel==='m'?'selected':''}>min</option></select><div style="display:flex;gap:6px"><button data-i="${i}" class="btn small move-up" ${disabledAttr}>▲</button><button data-i="${i}" class="btn small move-down" ${disabledAttr}>▼</button><button data-i="${i}" class="btn small del" ${disabledAttr}>✖</button></div>`;

  // drag handlers
  div.addEventListener('dragstart', (e)=>{
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', i);
    div.classList.add('dragging');
  });
  div.addEventListener('dragend', ()=>{ div.classList.remove('dragging'); const items = els.rounds.querySelectorAll('.round'); items.forEach(it=>it.classList.remove('drag-over-top','drag-over-bottom')); renderRounds(); });
  div.addEventListener('dragover', (e)=>{ e.preventDefault(); const dragging = els.rounds.querySelector('.dragging'); if(!dragging) return; const rect = div.getBoundingClientRect(); const mid = rect.top + rect.height/2; if(e.clientY < mid){ div.classList.add('drag-over-top'); div.classList.remove('drag-over-bottom'); } else { div.classList.add('drag-over-bottom'); div.classList.remove('drag-over-top'); } });
  div.addEventListener('dragleave', ()=>{ div.classList.remove('drag-over-top','drag-over-bottom'); });
  div.addEventListener('drop', (e)=>{ e.preventDefault(); const from = Number(e.dataTransfer.getData('text/plain')); const to = Number(div.dataset.index); if(isNaN(from) || isNaN(to)) return; const rect = div.getBoundingClientRect(); const mid = rect.top + rect.height/2; let insertAt = to; if(e.clientY > mid) insertAt = to + 1; const item = store.rounds.splice(from,1)[0]; if(from < insertAt) insertAt--; store.rounds.splice(insertAt,0,item); save(); renderRounds(); });

  els.rounds.appendChild(div);
});}
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}


// addRound handler (exposed globally as fallback for pages)
function addRoundHandler(){
  try{
    const n = (els.newName.value || '').trim() || (`Round ${store.rounds.length+1}`);
    const raw = parseFloat(els.newDur.value) || 0;
    const unitEl = document.getElementById('newUnit');
    const unit = unitEl ? unitEl.value : 's';
    const d = Math.max(1, Math.round(raw * (unit === 'm' ? 60 : 1)));
    store.rounds.push({name: n, dur: d});
    save(); renderRounds();
    // clear inputs for convenience
    els.newName.value = '';
    els.newDur.value = 60;
    if(unitEl) unitEl.value = 's';
    console.log('addRoundHandler: added', n, d);
  }catch(e){ console.error('addRoundHandler error', e); alert('Erro ao adicionar bloco: '+e.message); }
}
// attach listener if element exists
const _btnAdd = document.getElementById('addRound'); if(_btnAdd){ _btnAdd.addEventListener('click', addRoundHandler); }


els.rounds.addEventListener('input', e => { const t = e.target; const i = Number(t.dataset.i); if(isNaN(i)) return; if(t.classList.contains('rname')){ store.rounds[i].name = t.value; save(); } if(t.classList.contains('rdur')){ // numeric input changed
    const val = parseFloat(t.value) || 0; const unitSel = document.querySelector(`select.runit[data-i='${i}']`); const unit = unitSel ? unitSel.value : 's'; store.rounds[i].dur = Math.max(1, Math.round(val * (unit==='m'?60:1))); save(); }
  if(t.classList.contains('runit')){ // unit changed
    const valInput = document.querySelector(`input.rdur[data-i='${i}']`); const val = parseFloat(valInput.value) || 0; const unit = t.value; store.rounds[i].dur = Math.max(1, Math.round(val * (unit==='m'?60:1))); save(); }
});
els.rounds.addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return; const i = Number(b.dataset.i);
  if(b.classList.contains('del')){
    if(typeof running !== 'undefined' && running){ alert('Não é possível excluir enquanto o cronômetro está rodando.'); return; }
    store.rounds.splice(i,1); save(); renderRounds(); return;
  }
  if(b.classList.contains('move-up')){
    if(i>0){ const t = store.rounds[i-1]; store.rounds[i-1]=store.rounds[i]; store.rounds[i]=t; save(); renderRounds(); }
    return;
  }
  if(b.classList.contains('move-down')){
    if(i<store.rounds.length-1){ const t = store.rounds[i+1]; store.rounds[i+1]=store.rounds[i]; store.rounds[i]=t; save(); renderRounds(); }
    return;
  }
});

document.getElementById('applyAllRest').addEventListener('click',()=>{ if(!confirm('Aplicar descanso padrão para todos os rounds?')) return; store.rounds.forEach(r=>r.postRest = store.rest); save(); alert('Aplicado');});

document.getElementById('clearAll').addEventListener('click',()=>{ if(!confirm('Limpar tudo e restaurar padrão?')) return; store = {warmup:30,rest:60,end:60,rounds:[{name:'Round 1',dur:60},{name:'Round 2',dur:60}]}; save(); renderRounds(); });

// audio
function playTone(freq,duration,ctx){ try{ ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); const o = ctx.createOscillator(); const g = ctx.createGain(); o.type='sine'; o.frequency.value = freq; o.connect(g); g.connect(ctx.destination); g.gain.setValueAtTime(0.0001, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime + 0.01); o.start(); g.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + duration); o.stop(ctx.currentTime + duration + 0.02); }catch(e){/* ignore */} }
function playBeep(kind){ if(kind==='start') playTone(880,0.25); else if(kind==='next') { playTone(1200,0.18); setTimeout(()=>playTone(800,0.12),120); } else playTone(640,0.18); }

// timer engine
let seq = []; let idx=0; let phase='idle'; let remaining=0; let raf=0; let last=0;
function buildSeq(){ seq = []; // use exactly the configured blocks in order
  store.rounds.forEach((r)=>{ seq.push({type: r.name || 'Bloco', dur: r.dur || 0}); }); }
function start(){ if(running) return; if(seq.length===0) buildSeq(); if(phase==='idle'){ idx=0; remaining = seq[0].dur; phase=seq[0].type; playBeep('start'); } running=true; last=performance.now(); tick();}
function pause(){ running=false; if(raf) cancelAnimationFrame(raf); raf=0;}
function reset(){ pause(); buildSeq(); idx=0; phase='idle'; remaining=0; updateDisplay();}
function next(){ if(seq.length===0) buildSeq(); remaining=0; }
function prev(){ if(seq.length===0) buildSeq(); idx = Math.max(0, idx-1); remaining = seq[idx]?.dur || 0; phase = seq[idx]?.type || 'idle'; playBeep('next'); updateDisplay(); }

function tick(ts){ if(!running) return; const dt=(ts-last)/1000; last=ts; remaining -= dt; if(remaining<=0){ idx++; if(idx>=seq.length){ running=false; phase='Pronto'; remaining=0; updateDisplay(); playBeep('end'); return;} phase = seq[idx].type; remaining = seq[idx].dur; playBeep('next'); }
 updateDisplay(); raf = requestAnimationFrame(tick);} 

function formatTime(s){ s=Math.max(0,Math.round(s)); const m=Math.floor(s/60); const ss=s%60; return `${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}` }

function updateDisplay(){ if(phase==='idle' && seq.length>0){ phase = seq[idx]?.type || 'Pronto'; remaining = seq[idx]?.dur || 0; }
 phaseNameEl.textContent = phase || 'Pronto'; timeLeftEl.textContent = formatTime(remaining); infoEl.textContent = `Bloco ${idx+1} / ${seq.length} • Total: ${formatTime(totalDuration())}`;
 // progress ring update
 const totalForPhase = (seq[idx] && seq[idx].dur) ? seq[idx].dur : 1; const pct = totalForPhase>0 ? (Math.max(0,remaining)/totalForPhase) : 0; const circumference = 2*Math.PI*40; const dash = (circumference * pct).toFixed(2); progEl.setAttribute('stroke-dasharray', `${dash} ${circumference}`);
}

// central update used by save/load
function updateUI(){ try{ renderRounds(); buildSeq(); updateDisplay(); }catch(e){ console.error('updateUI error', e); } }

function totalDuration(){ buildSeq(); return seq.reduce((a,b)=>a+(b.dur||0),0); }

startBtn.addEventListener('click',start); pauseBtn.addEventListener('click',pause); resetBtn.addEventListener('click',reset); prevBtn.addEventListener('click',prev); nextBtn.addEventListener('click',next);

// init
load(); renderRounds(); buildSeq(); updateDisplay();

// autosave on unload
window.addEventListener('beforeunload', save);
</script>
</body>
</html>
