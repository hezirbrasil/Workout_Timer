<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Timer Builder — Cronômetro Simples</title>
<style>
  :root{--bg:#000;--fg:#eee;--accent:#8a2be2;--muted:#9b9b9b}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,Segoe UI,Roboto,Arial}
  .wrap{max-width:980px;margin:20px auto;padding:18px;display:grid;grid-template-columns:320px 1fr;gap:18px}
  .panel{background:#070707;border:1px solid rgba(138,43,226,0.12);padding:14px;border-radius:10px}
  h1{font-size:20px;margin:0 0 10px 0;color:var(--accent)}
  label{font-size:12px;color:var(--muted)}
  input[type=number],input[type=text],select{width:100%;padding:8px;border-radius:8px;border:1px solid #111;background:#050505;color:var(--fg);margin-top:6px}
  .list{margin-top:10px;max-height:520px;overflow:auto}
  .round{display:flex;gap:12px;align-items:center;padding:14px;border-radius:10px;background:linear-gradient(90deg,rgba(138,43,226,0.04),transparent);margin-bottom:10px;font-size:15px;touch-action:none;-webkit-user-select:none;user-select:none;cursor:grab}
  .round input{width:100px;padding:8px;border-radius:6px;border:1px solid #111;background:#050505;color:var(--fg)}
  .round .name{flex:1;font-size:15px}
  .round.dragging{opacity:0.7;transform:scale(0.99);cursor:grabbing}
  .btn{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--fg);padding:10px 14px;border-radius:12px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none}
  .btn.primary{background:linear-gradient(90deg,var(--accent),#6f50d8);color:#fff;border:0}

  /* timer */
  .timer{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px}
  .time{font-size:56px;font-weight:700;color:var(--fg)}
  .phase{font-size:14px;color:var(--muted);margin-bottom:6px}
  .controls{display:flex;gap:8px;margin-top:18px}
  .small{font-size:15px;padding:10px 12px}
  .meta{margin-top:12px;color:var(--muted);font-size:13px}
  .shortcut{min-width:120px;white-space:nowrap;text-align:center}

  /* progress ring */
  .ring{width:220px;height:220px;display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:12px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  .ring svg{transform:rotate(-90deg)}
  .ring .center{position:absolute;display:flex;flex-direction:column;align-items:center}

  @media(max-width:880px){.wrap{grid-template-columns:1fr;padding:12px}.timer{padding:18px}.time{font-size:44px}}
  /* compact mode: show only the timer panel */
  body.compact .wrap{grid-template-columns:0 1fr}
  body.compact .wrap > .panel:first-child{display:none}
  body.compact .wrap > .panel.timer{grid-column:1/-1}
  .exit-compact-btn{position:absolute;top:10px;right:10px;display:none}
  /* hide controls/meta in compact mode for a pure circle view */
  body.compact .meta, body.compact .exit-compact-btn, body.compact .warn-area{display:none !important}
  /* enlarge ring for compact view */
  body.compact .ring{width: min(92vw,92vh);height: min(92vw,92vh)}
  body.compact .ring svg{width:100%;height:100%}
  body.compact .ring .center .time{font-size:calc(8vh + 2vw);}
  body.compact .ring .center .phase{display:block;font-size:18px}
  .shortcut{min-width:120px;white-space:nowrap;text-align:center}
  /* overlay arrows */
  .overlay-arrow{position:absolute;top:50%;transform:translateY(-50%);background:linear-gradient(180deg,rgba(15,15,15,0.7),rgba(10,10,10,0.6));border:0;color:#fff;font-size:28px;padding:12px 14px;border-radius:50%;backdrop-filter:blur(6px);box-shadow:0 6px 18px rgba(0,0,0,0.6);z-index:40}
  .overlay-prev{left:12px}
  .overlay-next{right:12px}
  /* hidden by default; show only while running */
  .overlay-arrow{display:none}
  body.running .overlay-arrow{display:block}
  /* keep overlay pause always visible */
  .overlay-pause{display:block}
  /* hide prev/next in main controls by default; show only when running */
  #prev, #next{display:none}
  body.running #prev, body.running #next{display:inline-block}
  @media(max-width:880px){ .overlay-arrow{font-size:30px;padding:14px} .btn{padding:14px 18px;font-size:16px;border-radius:12px} .overlay-bottom{gap:12px} }

  /* bottom overlay group for pause */
  .overlay-bottom{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
  .overlay-bottom .overlay-arrow, .overlay-bottom .overlay-pause{position:static;transform:none}
  @media(max-width:880px){ .overlay-bottom{bottom:10px} }
  .round.dragging{opacity:0.6;transform:scale(0.995)}
  .round.drag-over-top{outline:2px dashed var(--accent);outline-offset:-6px}
  .round.drag-over-bottom{outline:2px dashed var(--accent);outline-offset:-6px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <h1>Timer Builder</h1>
      <!-- Removed warmup/rest/end: user will configure all blocks manually -->
      <div style="margin-top:6px;color:var(--muted);font-size:13px">Configure todos os blocos manualmente abaixo.</div>

      <hr style="opacity:0.06;margin:12px 0">
      <div style="display:flex;gap:8px;align-items:center">
        <div style="display:flex;flex-direction:column;gap:4px;flex:1">
          <input id="newName" type="text" placeholder="Nome do round (ex: Circuito)" style="padding:8px;border-radius:8px;border:1px solid #111;background:#050505;color:var(--fg)">
          <div style="display:flex;gap:8px;align-items:center">
            <div style="display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--muted)">
              <span>Minutos</span>
              <input id="newMin" type="number" value="1" min="0" style="width:70px" title="Minutos">
            </div>
            <div style="display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--muted)">
              <span>Segundos</span>
              <input id="newSec" type="number" value="0" min="0" max="59" style="width:70px" title="Segundos">
            </div>
            <div style="margin-left:auto"><button id="addRound" type="button" class="btn primary">Adicionar</button></div>
          </div>
        </div>
      </div>
      <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;">
        <label style="font-size:12px;color:var(--muted);align-self:center;margin-right:6px">Atalhos:</label>
        <button type="button" class="btn small shortcut" data-name="Aquecimento">Aquecimento</button>
        <button type="button" class="btn small shortcut" data-name="Round">Round</button>
        <button type="button" class="btn small shortcut" data-name="Descanso">Descanso</button>
        <button type="button" class="btn small shortcut" data-name="Troca">Troca</button>
        <button type="button" class="btn small shortcut" data-name="Encerramento">Encerramento</button>
      </div>

      <div><label style="font-weight:600;margin-bottom:6px;display:block;color:var(--muted)">Blocos adicionados</label><div class="list" id="rounds"></div></div>

      <div style="display:flex;gap:8px;margin-top:8px">
        <button id="clearAll" type="button" class="btn small">Limpar</button>
      </div>

      <div class="meta">Dica: edite nome e duração de cada round. As alterações são salvas automaticamente.</div>
    </div>

    <div class="panel timer">
      <div class="ring" id="ringContainer">
      <button id="exitCompact" class="btn small exit-compact-btn">Voltar</button>
      <!-- overlay arrows for quick advance/prev while running -->
      <button id="overlayPrev" class="btn small overlay-arrow overlay-prev" title="Anterior">◀</button>
      <button id="overlayNext" class="btn small overlay-arrow overlay-next" title="Próximo">▶</button>
        <svg width="220" height="220" viewBox="0 0 100 100">
          <defs>
            <linearGradient id="grad" x1="0" x2="1">
              <stop offset="0" stop-color="#9b59ff" />
              <stop offset="1" stop-color="#8a2be2" />
            </linearGradient>
          </defs>
          <circle cx="50" cy="50" r="40" stroke="rgba(255,255,255,0.06)" stroke-width="6" fill="none" />
          <circle id="prog" cx="50" cy="50" r="40" stroke="url(#grad)" stroke-width="6" stroke-linecap="round" stroke-dasharray="0 251.2" fill="none"></circle>
        </svg>
        <div class="center">
          <div class="phase" id="phaseName">Pronto</div>
          <div class="time" id="timeLeft">00:00</div>
        </div>
      </div>

      <div class="controls">
        <button id="prev" type="button" class="btn">◀</button>
        <button id="start" type="button" class="btn primary">Iniciar</button>
        <button id="pause" type="button" class="btn">Pausar</button>
        <button id="next" type="button" class="btn">▶</button>
      </div>

      <div class="warn-area" style="margin-top:10px;display:flex;gap:8px;align-items:center">
      <label style="font-size:13px;color:var(--muted);display:flex;align-items:center"><input id="warnToggle" type="checkbox" checked style="margin-right:8px"> Som aviso final</label>
      <input id="warnThreshold" type="number" value="5" min="1" style="width:60px">
      <span style="color:var(--muted);font-size:13px">segundos</span>
      </div>

      <div class="meta" id="info">Round 0 / 0 • Total: 00:00</div>
    </div>
  </div>

<script>
const LS='mma.simple.timer.v1';
let store = {warmup:30,rest:60,end:60,rounds:[{name:'Round 1',dur:60},{name:'Round 2',dur:60}]};
// runtime flag — declared early to avoid TDZ when updateUI/renderRounds runs before timer initialization
window.running = false;
function load(){try{const s=localStorage.getItem(LS); if(s) store=JSON.parse(s);}catch(e){} updateUI();}
function save(){localStorage.setItem(LS,JSON.stringify(store)); updateUI();}

const els={warmup:1,rest:1,end:1,rounds:1,newName:1,newMin:1,newSec:1,warnToggle:1,warnThreshold:1};
els.warmup = document.getElementById('warmup'); els.rest = document.getElementById('rest'); els.end = document.getElementById('end'); els.rounds = document.getElementById('rounds'); els.newName = document.getElementById('newName'); els.newMin = document.getElementById('newMin'); els.newSec = document.getElementById('newSec'); els.warnToggle = document.getElementById('warnToggle'); els.warnThreshold = document.getElementById('warnThreshold');
const startBtn=document.getElementById('start'); const pauseBtn=document.getElementById('pause'); const timeLeftEl=document.getElementById('timeLeft'); const phaseNameEl=document.getElementById('phaseName'); const infoEl=document.getElementById('info'); const progEl = document.getElementById('prog');

function renderRounds(){els.rounds.innerHTML=''; store.rounds.forEach((r,i)=>{
  const div=document.createElement('div'); div.className='round'; div.setAttribute('draggable','true'); div.dataset.index = i;
  const disabledAttr = window.running ? 'disabled' : '';
  // determine minutes and seconds for display
  const currentSeconds = r.dur || 0; const displayMin = Math.floor(currentSeconds/60); const displaySec = currentSeconds % 60;
  div.innerHTML = `<div class="name"><input data-i="${i}" class="rname" value="${escapeHtml(r.name)}" style="background:transparent;border:0;color:var(--fg)"></div><input data-i="${i}" class="rmin" type="number" value="${displayMin}" min="0" style="width:60px;padding:6px;border-radius:6px;border:1px solid #111;background:#050505;color:var(--fg)" title="min"><input data-i="${i}" class="rsec" type="number" value="${displaySec}" min="0" max="59" style="width:60px;padding:6px;border-radius:6px;border:1px solid #111;background:#050505;color:var(--fg)" title="sec"><div style="display:flex;gap:6px"><button data-i="${i}" class="btn small move-up" ${disabledAttr}>▲</button><button data-i="${i}" class="btn small move-down" ${disabledAttr}>▼</button><button data-i="${i}" class="btn small del" ${disabledAttr}>✖</button></div>`;

  // drag handlers (mouse)
  div.addEventListener('dragstart', (e)=>{
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', i);
    div.classList.add('dragging');
  });
  div.addEventListener('dragend', ()=>{ div.classList.remove('dragging'); const items = els.rounds.querySelectorAll('.round'); items.forEach(it=>it.classList.remove('drag-over-top','drag-over-bottom')); renderRounds(); });
  div.addEventListener('dragover', (e)=>{ e.preventDefault(); const dragging = els.rounds.querySelector('.dragging'); if(!dragging) return; const rect = div.getBoundingClientRect(); const mid = rect.top + rect.height/2; if(e.clientY < mid){ div.classList.add('drag-over-top'); div.classList.remove('drag-over-bottom'); } else { div.classList.add('drag-over-bottom'); div.classList.remove('drag-over-top'); } });
  div.addEventListener('dragleave', ()=>{ div.classList.remove('drag-over-top','drag-over-bottom'); });
  div.addEventListener('drop', (e)=>{ e.preventDefault(); const from = Number(e.dataTransfer.getData('text/plain')); const to = Number(div.dataset.index); if(isNaN(from) || isNaN(to)) return; const rect = div.getBoundingClientRect(); const mid = rect.top + rect.height/2; let insertAt = to; if(e.clientY > mid) insertAt = to + 1; const item = store.rounds.splice(from,1)[0]; if(from < insertAt) insertAt--; store.rounds.splice(insertAt,0,item); save(); renderRounds(); });

  // touch drag handlers (mobile)
  div.addEventListener('touchstart', (e)=>{
    if(e.touches.length !== 1) return;
    e.preventDefault();
    const t = e.touches[0];
    div.classList.add('dragging');
    // store dragging info globally
    window._touchDrag = {from: i, startY: t.clientY};
  }, {passive:false});
  div.addEventListener('touchmove', (e)=>{
    if(!window._touchDrag) return;
    const t = e.touches[0];
    e.preventDefault();
    const el = document.elementFromPoint(t.clientX, t.clientY);
    if(!el) return;
    const over = el.closest('.round');
    els.rounds.querySelectorAll('.round').forEach(it=>it.classList.remove('drag-over-top','drag-over-bottom'));
    if(!over || over === div) return;
    const rect = over.getBoundingClientRect(); const mid = rect.top + rect.height/2;
    if(t.clientY < mid){ over.classList.add('drag-over-top'); over.classList.remove('drag-over-bottom'); } else { over.classList.add('drag-over-bottom'); over.classList.remove('drag-over-top'); }
  }, {passive:false});
  div.addEventListener('touchend', (e)=>{
    const changed = e.changedTouches[0]; if(!changed || !window._touchDrag) { div.classList.remove('dragging'); delete window._touchDrag; return; }
    const from = window._touchDrag.from; const el = document.elementFromPoint(changed.clientX, changed.clientY); const over = el ? el.closest('.round') : null;
    let insertAt = store.rounds.length - 1;
    if(over){ const to = Number(over.dataset.index); if(!isNaN(to)){ const rect = over.getBoundingClientRect(); insertAt = (changed.clientY > (rect.top + rect.height/2)) ? to + 1 : to; } }
    // perform move
    if(typeof from === 'number' && !isNaN(from)){
      const item = store.rounds.splice(from,1)[0]; if(from < insertAt) insertAt--; store.rounds.splice(insertAt,0,item); save(); renderRounds();
    }
    div.classList.remove('dragging'); els.rounds.querySelectorAll('.round').forEach(it=>it.classList.remove('drag-over-top','drag-over-bottom'));
    delete window._touchDrag;
  }, {passive:false});
  div.addEventListener('touchcancel', ()=>{ div.classList.remove('dragging'); delete window._touchDrag; els.rounds.querySelectorAll('.round').forEach(it=>it.classList.remove('drag-over-top','drag-over-bottom')); });

  els.rounds.appendChild(div);
});}
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}


// addRound handler (exposed globally as fallback for pages)
function addRoundHandler(){
  try{
    let n = (els.newName.value || '').trim() || (`Round ${store.rounds.length+1}`);
    const mins = parseInt(els.newMin.value) || 0;
    const secs = parseInt(els.newSec.value) || 0;
    const d = Math.max(1, mins*60 + Math.round(secs));
    // alias mapping for quick words
    const aliasMap = {
      'aquecimento': 'Aquecimento', 'aquec': 'Aquecimento',
      'round': 'Round',
      'rest': 'Descanso', 'descanso': 'Descanso',
      'troca': 'Troca',
      'encerramento': 'Encerramento','fim':'Encerramento'
    };
    const norm = n.toLowerCase();
    for(const k in aliasMap){
      if(norm === k || norm.startsWith(k + ' ') || norm.startsWith(k)){
        // preserve suffix like "round 1"
        const suffix = n.slice(k.length).trim();
        n = aliasMap[k] + (suffix ? ' ' + suffix : '');
        break;
      }
    }
    store.rounds.push({name: n, dur: d});
    save(); renderRounds();
    // clear inputs for convenience
    els.newName.value = '';
    els.newMin.value = 1;
    els.newSec.value = 0;
    console.log('addRoundHandler: added', n, d);
  }catch(e){ console.error('addRoundHandler error', e); alert('Erro ao adicionar bloco: '+e.message); }
}
// attach listener if element exists
const _btnAdd = document.getElementById('addRound'); if(_btnAdd){ _btnAdd.addEventListener('click', addRoundHandler); }
// hook shortcut buttons
const shortcutBtns = document.querySelectorAll('.shortcut'); if(shortcutBtns && shortcutBtns.length){ shortcutBtns.forEach(b=>{ b.addEventListener('click', ()=>{ els.newName.value = b.dataset.name || ''; if(els.newMin) els.newMin.focus(); }); }); }


els.rounds.addEventListener('input', e => { const t = e.target; const i = Number(t.dataset.i); if(isNaN(i)) return; if(t.classList.contains('rname')){ store.rounds[i].name = t.value; save(); }
  if(t.classList.contains('rmin')){ const minVal = parseInt(t.value) || 0; const secInput = document.querySelector(`input.rsec[data-i='${i}']`); const secVal = parseInt(secInput?.value) || 0; store.rounds[i].dur = Math.max(1, minVal*60 + secVal); save(); }
  if(t.classList.contains('rsec')){ const secVal = parseInt(t.value) || 0; const minInput = document.querySelector(`input.rmin[data-i='${i}']`); const minVal = parseInt(minInput?.value) || 0; // allow sec overflow
    store.rounds[i].dur = Math.max(1, minVal*60 + secVal); save(); }
});
els.rounds.addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return; const i = Number(b.dataset.i);
  if(b.classList.contains('del')){
    if(window.running){ alert('Não é possível excluir enquanto o cronômetro está rodando.'); return; }
    store.rounds.splice(i,1); save(); renderRounds(); return;
  }
  if(b.classList.contains('move-up')){
    if(i>0){ const t = store.rounds[i-1]; store.rounds[i-1]=store.rounds[i]; store.rounds[i]=t; save(); renderRounds(); }
    return;
  }
  if(b.classList.contains('move-down')){
    if(i<store.rounds.length-1){ const t = store.rounds[i+1]; store.rounds[i+1]=store.rounds[i]; store.rounds[i]=t; save(); renderRounds(); }
    return;
  }
});

const applyAllRestBtn = document.getElementById('applyAllRest'); if(applyAllRestBtn){ applyAllRestBtn.addEventListener('click', ()=>{ if(!confirm('Aplicar descanso padrão para todos os rounds?')) return; store.rounds.forEach(r=>r.postRest = store.rest); save(); alert('Aplicado'); }); }

const clearAllBtn = document.getElementById('clearAll'); if(clearAllBtn){ clearAllBtn.addEventListener('click',()=>{ if(!confirm('Limpar tudo e restaurar padrão?')) return; store = {warmup:30,rest:60,end:60,rounds:[{name:'Round 1',dur:60},{name:'Round 2',dur:60}]}; save(); renderRounds(); }); }

// audio
let _audioCtx = null;
function ensureAudioContext(){ try{ if(!_audioCtx){ _audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } if(_audioCtx && _audioCtx.state === 'suspended'){ _audioCtx.resume().catch(()=>{}); } }catch(e){} }
function playTone(freq,duration,ctx){ try{ ctx = ctx || _audioCtx || new (window.AudioContext || window.webkitAudioContext)(); const o = ctx.createOscillator(); const g = ctx.createGain(); o.type='sine'; o.frequency.value = freq; o.connect(g); g.connect(ctx.destination); g.gain.setValueAtTime(0.0001, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime + 0.01); o.start(); g.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + duration); o.stop(ctx.currentTime + duration + 0.02); }catch(e){/* ignore */} }
function playBeep(kind){ if(kind==='start') playTone(880,0.25); else if(kind==='next') { playTone(1200,0.18); setTimeout(()=>playTone(800,0.12),120); } else if(kind==='warn'){ playTone(1400,0.12); } else playTone(640,0.18); }

// timer engine
var seq = window.seq || []; let idx=0; let phase='idle'; let remaining=0; let raf=0; let last=0; let lastWarnedSec = -1;
function buildSeq(){ seq = []; // use exactly the configured blocks in order
  store.rounds.forEach((r)=>{ seq.push({type: r.name || 'Bloco', dur: r.dur || 0}); }); }
function start(){ if(window.running) return; if(seq.length===0) buildSeq(); if(phase==='idle' || phase==='Pronto'){ idx=0; remaining = seq[0]?.dur || 0; phase = seq[0]?.type || 'Pronto'; playBeep('start'); } window.running = true; lastWarnedSec = -1; last = performance.now(); updateDisplay(); // enter compact timer-only mode
  try{ document.body.classList.add('compact'); document.body.classList.add('running'); }catch(e){}
  if(raf) cancelAnimationFrame(raf); raf = requestAnimationFrame(tick); }
function pause(){ window.running=false; try{ document.body.classList.remove('running'); }catch(e){}; if(raf) cancelAnimationFrame(raf); raf=0;}
function reset(){ // restart from beginning and stop
  pause(); buildSeq(); idx = 0; phase = seq[0]?.type || 'idle'; remaining = seq[0]?.dur || 0; lastWarnedSec = -1; updateDisplay(); }
function next(){ if(seq.length===0) buildSeq(); idx++; if(idx >= seq.length){ window.running = false; phase = 'Pronto'; remaining = 0; updateDisplay(); playBeep('end'); try{ document.body.classList.remove('compact'); document.body.classList.remove('running'); }catch(e){}; return; } phase = seq[idx]?.type || phase; remaining = seq[idx]?.dur || 0; lastWarnedSec = -1; playBeep('next'); updateDisplay(); last = performance.now(); }
function prev(){ if(seq.length===0) buildSeq(); idx = Math.max(0, idx-1); phase = seq[idx]?.type || phase; remaining = seq[idx]?.dur || 0; lastWarnedSec = -1; playBeep('next'); updateDisplay(); last = performance.now(); }

function tick(ts){ if(!window.running) return; if(typeof ts === 'undefined') ts = performance.now(); const dt = (ts - last) / 1000; last = ts; remaining -= dt; if(remaining <= 0){ idx++; if(idx >= seq.length){ window.running = false; phase = 'Pronto'; remaining = 0; updateDisplay(); playBeep('end'); // exit compact mode when finished
        try{ document.body.classList.remove('compact'); document.body.classList.remove('running'); }catch(e){}; return; } phase = seq[idx].type; remaining = seq[idx].dur; lastWarnedSec = -1; playBeep('next'); } else {
      // warning beeps in the final seconds
      try{
        if(els.warnToggle && els.warnToggle.checked){ const threshold = parseInt(els.warnThreshold?.value) || 5; const sec = Math.ceil(remaining); if(sec <= threshold && sec !== lastWarnedSec){ lastWarnedSec = sec; playBeep('warn'); } }
      }catch(e){/* ignore */}
    }
 updateDisplay(); raf = requestAnimationFrame(tick); } 

function formatTime(s){ s=Math.max(0,Math.round(s)); const m=Math.floor(s/60); const ss=s%60; return `${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}` }

function updateDisplay(){ try{
   if(phase==='idle' && seq.length>0){ phase = seq[idx]?.type || 'Pronto'; remaining = seq[idx]?.dur || 0; }
   if(phaseNameEl) phaseNameEl.textContent = phase || 'Pronto';
   if(timeLeftEl) timeLeftEl.textContent = formatTime(remaining);
   if(infoEl) infoEl.textContent = `Bloco ${idx+1} / ${seq.length} • Total: ${formatTime(totalDuration())}`;
   // progress ring update
   const totalForPhase = (seq[idx] && seq[idx].dur) ? seq[idx].dur : 1;
   const pct = totalForPhase>0 ? (Math.max(0,remaining)/totalForPhase) : 0;
   const circumference = 2*Math.PI*40;
   const dash = (circumference * pct).toFixed(2);
   if(progEl && typeof progEl.setAttribute === 'function') progEl.setAttribute('stroke-dasharray', `${dash} ${circumference}`);
 }catch(e){ console.error('updateDisplay error', e); }
}

// central update used by save/load
function updateUI(){ try{ renderRounds(); buildSeq(); updateDisplay(); }catch(e){ console.error('updateUI error', e); } }

function totalDuration(){ buildSeq(); return seq.reduce((a,b)=>a+(b.dur||0),0); }

const prevBtn = document.getElementById('prev'); const nextBtn = document.getElementById('next');
if(startBtn) startBtn.addEventListener('click',start); if(pauseBtn) pauseBtn.addEventListener('click',pause); if(prevBtn) prevBtn.addEventListener('click',prev); if(nextBtn) nextBtn.addEventListener('click',next);
// exit compact button
const exitCompactBtn = document.getElementById('exitCompact'); if(exitCompactBtn){ exitCompactBtn.addEventListener('click', ()=>{ // pause and show full UI
  try{ document.body.classList.remove('compact'); }catch(e){}; pause(); }); }
// ring tap / double-tap handlers for compact mode: single tap toggles pause/resume, double-tap exits compact
const ringContainer = document.getElementById('ringContainer'); if(ringContainer){ let lastTap = 0; const doubleMs = 350; const handleExit = ()=>{ try{ document.body.classList.remove('compact'); document.body.classList.remove('running'); }catch(e){}; pause(); };
  const onTap = (e)=>{
    // ignore taps that originated on controls/buttons
    if(e && e.target && e.target.closest && e.target.closest('button')) return;
    if(!document.body.classList.contains('compact')) return;
    const now = Date.now(); if(now - lastTap <= doubleMs){ // double-tap -> exit
      lastTap = 0; handleExit(); return; }
    lastTap = now;
    // single tap -> toggle
    if(window.running) pause(); else start();
  };
  // use pointerup for consistent single-tap behavior on Safari/iOS
  ringContainer.addEventListener('pointerup', (e)=>{ onTap(e); });
  // also handle touchend fallback
  ringContainer.addEventListener('touchend', (e)=>{ onTap(e); }, {passive:true});
  // ensure audio is available after first user gesture (important on iOS Safari)
  function _resumeAudioOnce(){ ensureAudioContext(); ringContainer.removeEventListener('pointerup', _resumeAudioOnce); document.removeEventListener('pointerdown', _resumeAudioOnce); }
  ringContainer.addEventListener('pointerup', _resumeAudioOnce, {passive:true});
  document.addEventListener('pointerdown', _resumeAudioOnce, {passive:true});
  // overlay arrows and controls — stop propagation so ring click doesn't catch them
  const ovPrev = document.getElementById('overlayPrev'); const ovNext = document.getElementById('overlayNext'); const ovPause = document.getElementById('overlayPause'); const ovReset = document.getElementById('overlayReset');
  const stopEvt = (fn)=>{ return (e)=>{ e.stopPropagation(); try{ e.preventDefault(); }catch(_){ } fn(e); }; };
  if(ovPrev){ ovPrev.addEventListener('click', stopEvt(()=>{ prev(); })); ovPrev.addEventListener('touchstart', stopEvt(()=>{}), {passive:false}); }
  if(ovNext){ ovNext.addEventListener('click', stopEvt(()=>{ next(); })); ovNext.addEventListener('touchstart', stopEvt(()=>{}), {passive:false}); }
  if(ovPause){ ovPause.addEventListener('click', stopEvt(()=>{ if(window.running) pause(); else start(); })); ovPause.addEventListener('touchstart', stopEvt(()=>{}), {passive:false}); }
  if(ovReset){ ovReset.addEventListener('click', stopEvt(()=>{ if(window.running){ remaining = seq[idx]?.dur || 0; lastWarnedSec = -1; last = performance.now(); updateDisplay(); playBeep('start'); } else { reset(); } })); ovReset.addEventListener('touchstart', stopEvt(()=>{}), {passive:false}); }
}

// init
load(); renderRounds(); buildSeq(); updateDisplay();

// autosave on unload
window.addEventListener('beforeunload', save);
</script>
