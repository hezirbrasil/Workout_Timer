<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Timer Builder — Cronômetro</title>
<style>
:root{--bg:#000;--fg:#eee;--accent:#8a2be2;--muted:#999}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial}
body{padding:18px}.wrap{max-width:980px;margin:auto;display:grid;grid-template-columns:360px 1fr;gap:18px}.panel{background:#070707;border:1px solid rgba(138,43,226,.12);padding:16px;border-radius:12px}h1{font-size:20px;margin:0 0 8px;color:var(--accent)}label,.meta{color:var(--muted);font-size:13px}
input{font:inherit}.top{display:flex;gap:8px;align-items:end}.field{flex:1}.field input{width:100%;margin-top:5px;padding:11px;border-radius:8px;border:1px solid #222;background:#050505;color:var(--fg)}
.time-fields{display:flex;gap:8px}.time-fields .field{min-width:70px}.btn{background:transparent;border:1px solid rgba(255,255,255,.12);color:var(--fg);padding:10px 12px;border-radius:10px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.btn.primary{background:linear-gradient(90deg,var(--accent),#6f50d8);border:0;color:#fff}.btn:disabled{opacity:.3;cursor:not-allowed}
.shortcuts{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.short{flex:1;min-width:100px}.list{margin-top:8px}.round{display:grid;grid-template-columns:1fr 62px 62px;gap:8px;padding:12px;margin-bottom:9px;border-radius:10px;background:linear-gradient(90deg,rgba(138,43,226,.05),transparent)}.round-name{grid-column:1/-1}.round input{width:100%;padding:9px;border-radius:7px;border:1px solid #222;background:#050505;color:var(--fg)}.round-actions{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.round-actions .btn{min-height:44px;font-size:16px}.move-up{border-color:rgba(138,43,226,.35)}.move-down{border-color:rgba(138,43,226,.35)}.delete{border-color:rgba(255,80,80,.3)}
.clear{width:100%;margin-top:4px}.timer{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:500px}.ring{width:240px;height:240px;position:relative;display:flex;align-items:center;justify-content:center}.ring svg{transform:rotate(-90deg)}.center{position:absolute;text-align:center}.phase{font-size:15px;color:var(--muted);margin-bottom:5px}.time{font-size:58px;font-weight:700}.controls{margin-top:18px}.start{min-width:190px;font-size:18px}.info{margin-top:12px}.warn{margin-top:14px;display:flex;align-items:center;gap:8px}.warn input[type=number]{width:60px;padding:7px;background:#050505;border:1px solid #222;border-radius:7px;color:#fff}
body.compact{padding:0;overflow:hidden}body.compact .wrap{display:block;width:100vw;height:100vh;max-width:none}body.compact .wrap>.panel:first-child{display:none}body.compact .timer{width:100vw;height:100vh;border:0;border-radius:0;padding:0}body.compact .controls,body.compact .warn,body.compact .info{display:none!important}body.compact .ring{width:min(88vw,88vh);height:min(88vw,88vh)}body.compact .ring svg{width:100%;height:100%}body.compact .time{font-size:clamp(64px,12vw,180px)}body.compact .phase{font-size:clamp(18px,3vw,32px)}
@media(max-width:700px){body{padding:10px}.wrap{display:block}.timer{margin-top:10px;min-height:330px}.top{display:block}.time-fields{margin-top:8px}.round{grid-template-columns:1fr 64px 64px}.round-actions{grid-template-columns:1fr 1fr 1fr}.btn{min-height:44px}.short{min-height:44px}.time{font-size:44px}.ring{width:190px;height:190px}}
</style>
</head>
<body>
<div class="wrap">
<section class="panel">
<h1>Timer Builder</h1>
<div class="meta">Configure todos os blocos manualmente abaixo.</div><hr style="opacity:.08;margin:12px 0">
<div class="top"><div class="field"><label>Nome do round</label><input id="newName" type="text" placeholder="Ex: Round 1"></div><button id="addRound" class="btn primary" type="button">Adicionar</button></div>
<div class="time-fields" style="margin-top:8px"><div class="field"><label>Minutos</label><input id="newMin" type="number" min="0" value="1"></div><div class="field"><label>Segundos</label><input id="newSec" type="number" min="0" max="59" value="0"></div></div>
<div class="shortcuts"><button class="btn short" data-name="Aquecimento" type="button">Aquecimento</button><button class="btn short" data-name="Round" type="button">Round</button><button class="btn short" data-name="Descanso" type="button">Descanso</button><button class="btn short" data-name="Troca" type="button">Troca</button><button class="btn short" data-name="Encerramento" type="button">Encerramento</button></div>
<label>Blocos adicionados</label><div id="rounds" class="list"></div><button id="clearAll" class="btn clear" type="button">Limpar</button>
<div class="meta" style="margin-top:10px">Use ▲ para subir, ▼ para descer e 🗑️ para excluir.</div>
</section>
<section class="panel timer">
<div class="ring"><svg width="240" height="240" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" stroke="rgba(255,255,255,.06)" stroke-width="6" fill="none"/><circle id="prog" cx="50" cy="50" r="40" stroke="url(#grad)" stroke-width="6" stroke-linecap="round" stroke-dasharray="0 251.2" fill="none"/><defs><linearGradient id="grad" x1="0" x2="1"><stop offset="0" stop-color="#9b59ff"/><stop offset="1" stop-color="#8a2be2"/></linearGradient></defs></svg><div class="center"><div id="phaseName" class="phase">Pronto</div><div id="timeLeft" class="time">00:00</div></div></div>
<div class="controls"><button id="start" class="btn primary start" type="button">Iniciar</button></div>
<div class="warn"><label><input id="warnToggle" type="checkbox" checked> Som aviso final</label><input id="warnThreshold" type="number" min="1" value="5"><span class="meta">segundos</span></div><div id="info" class="meta info">Bloco 0 / 0 • Total: 00:00</div>
</section></div>
<script>
const LS='mma.simple.timer.v1';
let store={rounds:[{name:'Round 1',dur:60},{name:'Round 2',dur:60}]};
let seq=[],idx=0,remaining=0,phase='Pronto',raf=0,last=0,lastWarned=-1;window.running=false;
const $=id=>document.getElementById(id);const roundsEl=$('rounds');
function load(){try{const s=localStorage.getItem(LS);if(s){const x=JSON.parse(s);if(Array.isArray(x.rounds))store=x}}catch(e){}updateUI()}
function save(){localStorage.setItem(LS,JSON.stringify(store))}
function formatTime(s){s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function buildSeq(){seq=store.rounds.map(r=>({type:r.name||'Bloco',dur:Math.max(1,Number(r.dur)||1)}))}
function totalDuration(){return store.rounds.reduce((a,r)=>a+(Number(r.dur)||0),0)}
function renderRounds(){roundsEl.innerHTML='';store.rounds.forEach((r,i)=>{const d=document.createElement('div');d.className='round';d.innerHTML='<div class="round-name"><input class="rname" data-i="'+i+'" value="'+escapeHtml(r.name)+'"></div><input class="rmin" data-i="'+i+'" type="number" min="0" value="'+Math.floor((r.dur||0)/60)+'"><input class="rsec" data-i="'+i+'" type="number" min="0" max="59" value="'+((r.dur||0)%60)+'"><div class="round-actions"><button class="btn move-up" data-i="'+i+'" type="button" '+(i===0?'disabled':'')+'>▲ Subir</button><button class="btn move-down" data-i="'+i+'" type="button" '+(i===store.rounds.length-1?'disabled':'')+'>▼ Descer</button><button class="btn delete" data-i="'+i+'" type="button">🗑️ Excluir</button></div>';roundsEl.appendChild(d)})}
function updateDisplay(){const total=seq.length; $('phaseName').textContent=phase||'Pronto';$('timeLeft').textContent=formatTime(remaining);$('info').textContent='Bloco '+(total?idx+1:0)+' / '+total+' • Total: '+formatTime(totalDuration());const t=seq[idx]?.dur||1;const pct=Math.max(0,Math.min(1,remaining/t));$('prog').setAttribute('stroke-dasharray',(2*Math.PI*40*pct).toFixed(2)+' '+(2*Math.PI*40))}
function updateUI(){buildSeq();renderRounds();if(!window.running){idx=Math.min(idx,Math.max(0,seq.length-1));phase=seq[idx]?.type||'Pronto';remaining=seq[idx]?.dur||0}updateDisplay()}
roundsEl.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const i=Number(b.dataset.i);if(!Number.isInteger(i)||window.running)return;if(b.classList.contains('delete')){store.rounds.splice(i,1)}else if(b.classList.contains('move-up')&&i>0){[store.rounds[i-1],store.rounds[i]]=[store.rounds[i],store.rounds[i-1]]}else if(b.classList.contains('move-down')&&i<store.rounds.length-1){[store.rounds[i],store.rounds[i+1]]=[store.rounds[i+1],store.rounds[i]]}else{return}save();buildSeq();idx=Math.min(idx,Math.max(0,seq.length-1));phase=seq[idx]?.type||'Pronto';remaining=seq[idx]?.dur||0;renderRounds();updateDisplay()});
roundsEl.addEventListener('input',e=>{const t=e.target,i=Number(t.dataset.i);if(!Number.isInteger(i)||!store.rounds[i])return;if(t.classList.contains('rname'))store.rounds[i].name=t.value;if(t.classList.contains('rmin')||t.classList.contains('rsec')){const card=t.closest('.round');const min=Number(card.querySelector('.rmin').value)||0;const sec=Math.max(0,Math.min(59,Number(card.querySelector('.rsec').value)||0));store.rounds[i].dur=Math.max(1,min*60+sec)}save();buildSeq();updateDisplay()});
$('addRound').addEventListener('click',()=>{const name=($('newName').value||'').trim()||'Round '+(store.rounds.length+1);const min=Number($('newMin').value)||0;const sec=Math.max(0,Math.min(59,Number($('newSec').value)||0));store.rounds.push({name,dur:Math.max(1,min*60+sec)});save();$('newName').value='';$('newMin').value=1;$('newSec').value=0;updateUI()});
document.querySelectorAll('.short').forEach(b=>b.addEventListener('click',()=>{$('newName').value=b.dataset.name;$('newName').focus()}));
$('clearAll').addEventListener('click',()=>{if(!confirm('Limpar tudo e restaurar os rounds padrão?'))return;store={rounds:[{name:'Round 1',dur:60},{name:'Round 2',dur:60}]};save();reset()});
function tone(freq,duration){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=freq;o.connect(g);g.connect(c.destination);g.gain.value=.12;o.start();o.stop(c.currentTime+duration)}catch(e){}}
function beep(kind){if(kind==='next'){tone(1200,.12);setTimeout(()=>tone(800,.1),130)}else if(kind==='warn')tone(1400,.1);else if(kind==='end')tone(640,.2);else tone(880,.2)}
function start(){if(window.running||!seq.length)return;buildSeq();idx=0;phase=seq[0].type;remaining=seq[0].dur;window.running=true;last=performance.now();lastWarned=-1;document.body.classList.add('compact');beep('start');raf=requestAnimationFrame(tick)}
function tick(ts){if(!window.running)return;const dt=(ts-last)/1000;last=ts;remaining-=dt;if(remaining<=0){idx++;if(idx>=seq.length){window.running=false;phase='Pronto';remaining=0;document.body.classList.remove('compact');beep('end');updateDisplay();return}phase=seq[idx].type;remaining=seq[idx].dur;lastWarned=-1;beep('next')}else if($('warnToggle').checked){const threshold=Number($('warnThreshold').value)||5,sec=Math.ceil(remaining);if(sec<=threshold&&sec!==lastWarned){lastWarned=sec;beep('warn')}}updateDisplay();raf=requestAnimationFrame(tick)}
function reset(){window.running=false;if(raf)cancelAnimationFrame(raf);document.body.classList.remove('compact');buildSeq();idx=0;phase=seq[0]?.type||'Pronto';remaining=seq[0]?.dur||0;updateUI()}
$('start').addEventListener('click',start);
let taps=0,tapTimer=null;document.querySelector('.ring').addEventListener('pointerup',e=>{if(!document.body.classList.contains('compact'))return;if(e.target.closest('button'))return;taps++;clearTimeout(tapTimer);if(taps>=3){taps=0;reset();return}tapTimer=setTimeout(()=>taps=0,700)});
window.addEventListener('beforeunload',save);load();
</script></body></html>
