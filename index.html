<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#8a2be2"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="Workout Timer"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Workout Timer</title><style>:root{--bg:#000;--fg:#eee;--a:#8a2be2;--m:#999}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,Arial}body{padding:12px}.wrap{max-width:980px;margin:auto;display:grid;grid-template-columns:360px 1fr;gap:16px}.panel{background:#070707;border:1px solid #21102e;padding:16px;border-radius:12px}h1{color:var(--a);font-size:20px}.meta,label{color:var(--m);font-size:13px}.top{display:flex;gap:8px}.field{flex:1}.field input,.round input{width:100%;padding:10px;background:#050505;color:#eee;border:1px solid #222;border-radius:8px}.time-fields{display:flex;gap:8px;margin-top:8px}.btn{padding:10px 12px;border-radius:10px;background:transparent;color:#eee;border:1px solid #333;touch-action:manipulation}.primary{background:linear-gradient(90deg,var(--a),#6f50d8);border:0}.shortcuts{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.short{flex:1;min-width:90px}.list{margin-top:8px}.round{display:grid;grid-template-columns:1fr 64px 64px;gap:8px;padding:12px;margin-bottom:8px;background:#0a0a0a;border-radius:10px}.round-name,.round-actions{grid-column:1/-1}.round-actions{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.round-actions .btn{min-height:44px;font-size:14px}.delete{border-color:#633}.rest{border-color:#365}.timer{min-height:500px;display:flex;flex-direction:column;align-items:center;justify-content:center}.ring{width:240px;height:240px;position:relative;display:flex;align-items:center;justify-content:center}.rin /* MOBILE CONFIG UI */
@media (max-width: 600px) {
  html, body { min-height: 100%; }
  .wrap { display:block; width:100%; max-width:none; margin:0; padding:10px; }
  .wrap > .panel:first-child { padding:14px; border-radius:14px; }
  .wrap > .panel.timer { margin-top:10px; padding:14px; border-radius:14px; }
  .panel h1 { font-size:22px; }
  .panel:first-child > div:first-of-type { font-size:14px !important; }
  #newName { min-height:48px; font-size:16px; padding:12px !important; }
  #newMin, #newSec { width:82px !important; min-height:48px; font-size:18px; text-align:center; }
  #addRound { min-height:48px; padding:12px 18px; font-size:16px; }
  .shortcut { min-height:44px; min-width:0; flex:1 1 calc(50% - 6px); font-size:14px; }
  .round { display:grid; grid-template-columns:1fr 68px 68px; gap:8px; padding:12px; align-items:center; }
  .round .name { grid-column:1 / -1; }
  .round .name input { width:100% !important; min-height:44px; font-size:16px !important; }
  .round input.rmin, .round input.rsec { width:68px !important; min-height:44px; font-size:16px; text-align:center; }
  .round > div:last-child { grid-column:1 / -1; display:flex; gap:8px !important; }
  .round > div:last-child .btn { flex:1; min-height:44px; }
  #clearAll { min-height:46px; width:100%; font-size:16px; }
  .list { max-height:none; overflow:visible; }
  .warn-area { flex-wrap:wrap; }
  .warn-area input[type=number] { min-height:44px; font-size:16px; }
  body:not(.compact) .timer { display:flex; }
  body:not(.compact) .timer .ring { width:180px; height:180px; }
  body:not(.compact) .timer .ring svg { width:180px; height:180px; }
  body:not(.compact) .timer .time { font-size:42px; }
  body:not(.compact) .timer .phase { font-size:13px; }
  body:not(.compact) .timer .controls #start { min-height:54px; min-width:180px; font-size:18px; }
}
@media (max-width: 380px) {
  .round { grid-template-columns:1fr 62px 62px; gap:6px; }
  .round input.rmin, .round input.rsec { width:62px !important; }
  .shortcut { font-size:13px; }
}

</style></head><body><div class="wrap"><section class="panel"><h1>Workout Timer</h1><div class="meta">Configure todos os blocos manualmente abaixo.</div><hr><div class="top"><div class="field"><label>Nome do round</label><input id="newName" placeholder="Ex: Round 1"></div><button id="addRound" class="btn primary">Adicionar</button></div><div class="time-fields"><div class="field"><label>Minutos</label><input id="newMin" type="number" min="0" value="1"></div><div class="field"><label>Segundos</label><input id="newSec" type="number" min="0" max="59" value="0"></div></div><div class="shortcuts"><button class="btn short" data-name="Aquecimento">Aquecimento</button><button class="btn short" data-name="Round">Round</button><button class="btn short" data-name="Descanso">Descanso</button><button class="btn short" data-name="Troca">Troca</button><button class="btn short" data-name="Encerramento">Encerramento</button></div><label>Blocos adicionados</label><div id="rounds" class="list"></div><button id="clearAll" class="btn" style="width:100%">Limpar</button><div class="meta">Use ▲ para subir, ▼ para descer, 📋 para duplicar, 💤 para adicionar descanso e 🗑️ para excluir.</div></section><section class="panel timer"><button id="exitMenu" type="button" class="btn exit-menu-btn">← Menu</button><div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" stroke="#222" stroke-width="6" fill="none"/><circle id="prog" cx="50" cy="50" r="40" stroke="#8a2be2" stroke-width="6" stroke-linecap="round" fill="none"/></svg><div class="center"><div id="phaseName" class="phase">Pronto</div><div id="timeLeft" class="time">00:00</div></div></div><div class="controls"><button id="start" type="button" class="btn primary">Iniciar</button></div><div class="timer-nav"><button id="prev" type="button" class="btn" aria-label="Bloco anterior">‹</button><button id="pause" type="button" class="btn pause" aria-label="Pausar">Ⅱ</button><button id="next" type="button" class="btn" aria-label="Próximo bloco">›</button></div><div id="info" class="meta info">Bloco 0 / 0 • Total: 00:00</div></section></div><script>const LS='mma.simple.timer.v1',$=id=>document.getElementById(id);let store={rounds:[{name:'Round 1',dur:60},{name:'Round 2',dur:60}]},seq=[],idx=0,remaining=0,phase='Pronto',raf=0,last=0,lastWarned=-1;window.running=false;window.paused=false;let audioCtx=null;const roundsEl=$('rounds');function save(){localStorage.setItem(LS,JSON.stringify(store))}function load(){try{let x=JSON.parse(localStorage.getItem(LS));if(x&&Array.isArray(x.rounds))store=x}catch(e){}updateUI()}function buildSeq(){seq=store.rounds.map(r=>({type:r.name||'Bloco',dur:Math.max(1,Number(r.dur)||1)}))}function fmt(s){s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;')}function render(){roundsEl.innerHTML='';store.rounds.forEach((r,i)=>{let d=document.createElement('div');d.className='round';d.innerHTML='<div class="round-name"><input class="rname" data-i="'+i+'" value="'+esc(r.name)+'"></div><input class="rmin" data-i="'+i+'" type="number" min="0" value="'+Math.floor(r.dur/60)+'"><input class="rsec" data-i="'+i+'" type="number" min="0" max="59" value="'+r.dur%60+'"><div class="round-actions"><button class="btn up" data-i="'+i+'" type="button" '+(i?'':'disabled')+'>▲</button><button class="btn down" data-i="'+i+'" type="button" '+(i<store.rounds.length-1?'':'disabled')+'>▼</button><button class="btn duplicate" data-i="'+i+'" type="button">📋</button><button class="btn rest" data-i="'+i+'" type="button">💤</button><button class="btn delete" data-i="'+i+'" type="button">🗑️</button></div>';roundsEl.appendChild(d)})}function display(){let total=seq.length,t=seq[idx]?.dur||1;$('phaseName').textContent=phase||'Pronto';$('timeLeft').textContent=fmt(remaining);$('info').textContent='Bloco '+(total?idx+1:0)+' / '+total+' • Total: '+fmt(store.rounds.reduce((a,r)=>a+(Number(r.dur)||0),0));$('prog').setAttribute('stroke-dasharray',(2*Math.PI*40*Math.max(0,Math.min(1,remaining/t)))+' '+(2*Math.PI*40));$('pause').textContent=window.paused?'▶':'Ⅱ'}function updateUI(){buildSeq();render();if(!window.running){idx=Math.min(idx,Math.max(0,seq.length-1));phase=seq[idx]?.type||'Pronto';remaining=seq[idx]?.dur||0}display()}roundsEl.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||window.running)return;let i=+b.dataset.i;if(!Number.isInteger(i)||!store.rounds[i])return;if(b.classList.contains('delete'))store.rounds.splice(i,1);else if(b.classList.contains('up')&&i>0)[store.rounds[i-1],store.rounds[i]]=[store.rounds[i],store.rounds[i-1]];else if(b.classList.contains('down')&&i<store.rounds.length-1)[store.rounds[i],store.rounds[i+1]]=[store.rounds[i+1],store.rounds[i]];else if(b.classList.contains('duplicate'))store.rounds.splice(i+1,0,{name:store.rounds[i].name,dur:store.rounds[i].dur});else if(b.classList.contains('rest'))store.rounds.splice(i+1,0,{name:'Descanso',dur:30});else return;save();updateUI()});roundsEl.addEventListener('input',e=>{let t=e.target,i=+t.dataset.i;if(!store.rounds[i])return;if(t.classList.contains('rname'))store.rounds[i].name=t.value;else{let c=t.closest('.round'),m=+c.querySelector('.rmin').value||0,s=Math.max(0,Math.min(59,+c.querySelector('.rsec').value||0));store.rounds[i].dur=Math.max(1,m*60+s)}save();buildSeq();display()});$('addRound').onclick=()=>{let name=($('newName').value||'').trim()||'Round '+(store.rounds.length+1),m=+$('newMin').value||0,s=Math.max(0,Math.min(59,+$('newSec').value||0));store.rounds.push({name,dur:Math.max(1,m*60+s)});save();$('newName').value='';updateUI()};document.querySelectorAll('.short').forEach(b=>b.onclick=()=>{$('newName').value=b.dataset.name});$('clearAll').onclick=()=>{if(confirm('Limpar tudo e restaurar os rounds padrão?')){store={rounds:[{name:'Round 1',dur:60},{name:'Round 2',dur:60}]};save();reset()}};function initAudio(){try{let C=window.AudioContext||window.webkitAudioContext;if(!C)return null;if(!audioCtx)audioCtx=new C;if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}catch(e){return null}}function tone(f,d){try{let c=initAudio();if(!c)return;let o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.value=.12;o.start();o.stop(c.currentTime+d)}catch(e){}}function beep(k){if(k==='warn')tone(1400,.1);else if(k==='next'){tone(1200,.12);setTimeout(()=>tone(800,.1),130)}else if(k==='end')tone(640,.2);else tone(880,.2)}function start(){if(window.running||!seq.length)return;initAudio();buildSeq();idx=0;phase=seq[0].type;remaining=seq[0].dur;window.running=true;window.paused=false;last=performance.now();lastWarned=-1;document.body.classList.add('compact');beep('start');raf=requestAnimationFrame(tick)}function tick(ts){if(!window.running||window.paused)return;remaining-=(ts-last)/1000;last=ts;if(remaining<=0){idx++;if(idx>=seq.length){window.running=false;window.paused=false;phase='Pronto';remaining=0;document.body.classList.remove('compact');beep('end');display();return}phase=seq[idx].type;remaining=seq[idx].dur;lastWarned=-1;beep('next')}else{let sec=Math.ceil(remaining);if(sec<=3&&sec>=1&&sec!==lastWarned){lastWarned=sec;beep('warn')}}display();raf=requestAnimationFrame(tick)}function reset(){window.running=false;window.paused=false;if(raf)cancelAnimationFrame(raf);document.body.classList.remove('compact');buildSeq();idx=0;phase=seq[0]?.type||'Pronto';remaining=seq[0]?.dur||0;updateUI()}function togglePause(){if(!window.running)return;window.paused=!window.paused;if(window.paused){if(raf)cancelAnimationFrame(raf);display()}else{initAudio();last=performance.now();raf=requestAnimationFrame(tick);display()}}function prevBlock(){if(!seq.length)return;let wasRunning=window.running;if(wasRunning&&raf)cancelAnimationFrame(raf);idx=Math.max(0,idx-1);phase=seq[idx].type;remaining=seq[idx].dur;lastWarned=-1;window.paused=false;if(wasRunning){last=performance.now();raf=requestAnimationFrame(tick)}display();beep('next')}function nextBlock(){if(!seq.length)return;let wasRunning=window.running;if(wasRunning&&raf)cancelAnimationFrame(raf);idx=Math.min(seq.length-1,idx+1);phase=seq[idx].type;remaining=seq[idx].dur;lastWarned=-1;window.paused=false;if(wasRunning){last=performance.now();raf=requestAnimationFrame(tick)}display();beep('next')}$('exitMenu').onclick=reset;$('start').onclick=start;$('pause').onclick=togglePause;$('prev').onclick=prevBlock;$('next').onclick=nextBlock;window.addEventListener('beforeunload',save);if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}))}load();</script><script>

</script><script id="start-visibility-fix-script">
