name: One-time cleanup

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean old bulk script tags
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8-sig')
          s=s.replace('<script src="bulk-duplicate.js"></script>','')
          s=s.replace('/* TIMER NAV ICONS */','')
          s=s.replace('</body>','<script src="bulk-duplicate.js"></script></body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Install clean bulk duplication in index'
          git push
