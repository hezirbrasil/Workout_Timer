name: Fix timer navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply timer navigation fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'TIMER_NAV_VISIBILITY_FIX_V1'
          if marker in s:
              raise SystemExit(0)
          css = '''<style id="timer-nav-visibility-fix">\n/* TIMER_NAV_VISIBILITY_FIX_V1 */\n.timer-nav{display:none!important}\nbody.compact .timer-nav{display:none!important}\n</style>'''
          js = '''<script id="timer-nav-visibility-script">\n(function(){\n  const nav=document.getElementById('timer-nav');\n  const buttons=document.querySelector('.timer-nav');\n  if(!buttons)return;\n  buttons.setAttribute('data-fix','TIMER_NAV_VISIBILITY_FIX_V1');\n  const sync=()=>{buttons.style.setProperty('display',window.running?'flex':'none','important')};\n  sync();\n  setInterval(sync,100);\n})();\n</script>'''
          if '</style></head>' in s:
              s=s.replace('</style></head>', '</style>'+css+'</head>', 1)
          else:
              s=s.replace('</head>', css+'</head>', 1)
          s=s.replace('</body>', js+'</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix timer controls visibility'
          git push