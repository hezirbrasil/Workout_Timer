name: Cleanup timer nav comment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove stray comment and duplicate nav style
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          original=s
          s=s.replace('/* TIMER NAV ICONS */','')
          # Remove accidental duplicate style block if it exists immediately after the visibility fix.
          dup='''<style id="timer-nav-icons">\n.timer-nav .btn {\n  display:inline-flex; align-items:center; justify-content:center;\n  width:62px; height:62px; min-width:62px; min-height:62px;\n  padding:0; border-radius:50%;\n  border:1px solid rgba(138,43,226,.55);\n  background:rgba(255,255,255,.045); color:#fff;\n  box-shadow:0 6px 20px rgba(0,0,0,.35);\n  font-size:30px; font-weight:500; line-height:1;\n  transition:transform .12s ease, background .12s ease;\n}\n.timer-nav .btn:active { transform:scale(.92); background:rgba(138,43,226,.28); }\n.timer-nav .pause { width:78px; height:78px; min-width:78px; min-height:78px; border:0; background:linear-gradient(145deg,#9b4dff,#6f20c9); box-shadow:0 8px 25px rgba(138,43,226,.4); font-size:28px; }\n</style>'''
          first=s.find(dup)
          second=s.find(dup, first+1) if first!=-1 else -1
          if second!=-1:
              s=s[:second]+s[second+len(dup):]
          if s!=original:
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Remove stray timer nav comment [skip ci]'
          git push
