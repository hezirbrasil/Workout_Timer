name: Force remove legacy login

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove login overlay from index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- WORKOUT_TIMER_AUTH_V1 -->'
          if marker in s:
              s = re.sub(r'\s*<!-- WORKOUT_TIMER_AUTH_V1 -->.*?</script>\s*', '\n', s, count=1, flags=re.S)
              p.write_text(s, encoding='utf-8')
              print('Legacy login removed')
          else:
              print('No legacy login present')
          PY
      - name: Refresh cache version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('service-worker.js')
          s = p.read_text(encoding='utf-8')
          import re
          s = re.sub(r"workout-timer-v\d+", "workout-timer-v14", s, count=1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit if changed
        run: |
          if git diff --quiet -- index.html service-worker.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js
          git commit -m 'Remove legacy login overlay [skip ci]'
          git push
