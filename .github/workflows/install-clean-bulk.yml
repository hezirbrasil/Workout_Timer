name: Install clean bulk duplication

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install current bulk script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8-sig')
          s=re.sub(r'<script[^>]+src=["\']bulk-duplicate-clean\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script>', '', s, flags=re.I)
          s=s.replace('</body>','<script src="bulk-duplicate-clean.js?v=3"></script>\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Use original duplicate handler for bulk duplication [skip ci]'
          git push
