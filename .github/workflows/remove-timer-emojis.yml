name: Remove timer emojis

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace timer control emojis
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'aria-label="Bloco anterior">⏮</button>': 'aria-label="Bloco anterior">‹</button>',
              'aria-label="Pausar">⏸ Pausar</button>': 'aria-label="Pausar">Ⅱ</button>',
              "$('pause').textContent=window.paused?'▶ Continuar':'⏸ Pausar'": "$('pause').textContent=window.paused?'▶':'Ⅱ'",
              'aria-label="Próximo bloco">⏭</button>': 'aria-label="Próximo bloco">›</button>',
          }
          for a,b in replacements.items():
              s = s.replace(a,b)
          marker = '/* TIMER NAV ICONS */'
          css = '''\n<style id="timer-nav-icons">\n.timer-nav .btn {\n  display:inline-flex; align-items:center; justify-content:center;\n  width:62px; height:62px; min-width:62px; min-height:62px;\n  padding:0; border-radius:50%;\n  border:1px solid rgba(138,43,226,.55);\n  background:rgba(255,255,255,.045); color:#fff;\n  box-shadow:0 6px 20px rgba(0,0,0,.35);\n  font-size:30px; font-weight:500; line-height:1;\n  transition:transform .12s ease, background .12s ease;\n}\n.timer-nav .btn:active { transform:scale(.92); background:rgba(138,43,226,.28); }\n.timer-nav .pause { width:78px; height:78px; min-width:78px; min-height:78px; border:0; background:linear-gradient(145deg,#9b4dff,#6f20c9); box-shadow:0 8px 25px rgba(138,43,226,.4); font-size:28px; }\n</style>\n'''
          if marker not in s:
              s = s.replace('</head>', marker + css + '</head>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Fix timer control icons" && git push)