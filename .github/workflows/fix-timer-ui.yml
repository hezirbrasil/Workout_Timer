name: Fix Timer UI

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/fix-timer-ui.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix visible CSS comment and timer navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # The CSS label was accidentally placed outside the style tag,
          # so the browser rendered it as visible page text.
          s = s.replace('</style>/* TIMER NAV ICONS */', '</style><!-- TIMER NAV ICONS -->')

          # Keep timer navigation hidden until the timer is actually running.
          marker = '</body>'
          script = r'''<script id="timer-nav-visibility">
(function(){
  function syncTimerNav(){
    var nav=document.querySelector('.timer-nav');
    if(!nav) return;
    nav.style.display = window.running ? 'flex' : 'none';
  }
  syncTimerNav();
  setInterval(syncTimerNav, 100);
})();
</script>'''
          if 'id="timer-nav-visibility"' not in s and marker in s:
              s = s.replace(marker, script + marker)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Fix timer navigation visibility [skip ci]'
            git push
          fi
