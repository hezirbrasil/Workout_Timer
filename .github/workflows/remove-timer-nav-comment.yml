name: Remove stray timer nav comment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove stray comment from index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = s
          s = s.replace('/* TIMER NAV ICONS */', '')
          s = s.replace('TIMER NAV ICONS', '')
          if s == old:
              print('Comment not present; nothing to change')
              raise SystemExit(0)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Remove stray timer nav comment [skip ci]'
          git push
