name: Ajustar tela inicial

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remover fisicamente controles extras
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove os controles sobrepostos do cronômetro.
          s = re.sub(r'\s*<button id="exitCompact"[^>]*>.*?</button>', '', s, flags=re.S)
          s = re.sub(r'\s*<button id="overlayPrev"[^>]*>.*?</button>', '', s, flags=re.S)
          s = re.sub(r'\s*<button id="overlayNext"[^>]*>.*?</button>', '', s, flags=re.S)
          s = re.sub(r'\s*<div class="overlay-bottom">.*?</div>', '', s, flags=re.S)

          # Na tela inicial, deixa literalmente apenas o botão Iniciar.
          s = re.sub(
              r'<div class="controls">.*?</div>',
              '<div class="controls"><button id="start" type="button" class="btn primary">Iniciar</button></div>',
              s,
              count=1,
              flags=re.S
          )

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commitar alteração
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Remover fisicamente controles extras do timer'
          git push
