name: Ajustar tela inicial

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remover controles da tela inicial
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* TELA INICIAL: somente Iniciar */'
          if marker not in s:
              s = s.replace('</style>', '''\n  /* TELA INICIAL: somente Iniciar */\n  body:not(.compact) .controls #prev,\n  body:not(.compact) .controls #pause,\n  body:not(.compact) .controls #next,\n  body:not(.compact) #exitCompact,\n  body:not(.compact) #overlayPrev,\n  body:not(.compact) #overlayNext,\n  body:not(.compact) #overlayPause { display:none !important; }\n  body:not(.compact) .controls { display:flex; }\n  body:not(.compact) .controls #start { display:inline-block !important; }\n  </style>''', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commitar alteração
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Mostrar apenas Iniciar na tela inicial'
          git push
